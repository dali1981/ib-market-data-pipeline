[project]
name = "earnings-calendar-dlt"
version = "0.1.0"
description = "Modular earnings calendar scraper with dlt and Dagster integration"
requires-python = ">=3.10"
dependencies = [
    "dlt[filesystem,parquet,duckdb]>=0.4.0",
    "playwright>=1.48.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=21.0.0",
    "httpx>=0.27.0",
    "rich>=14.0.0",
    "curl-cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pytesseract>=0.3.13",
    "pillow>=12.0.0",
    "ollama>=0.6.0",
    "langchain>=1.0.2",
    "langchain-ollama>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
]
