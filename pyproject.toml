
[project]
name = "dlt-ibapi"
version = "0.1.0"
description = "Production-ready market data pipeline for Interactive Brokers with gap-aware backfilling and Parquet storage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mohamed Ali", email = "your.email@example.com"}
]
keywords = [
    "interactive-brokers",
    "market-data",
    "dlt",
    "data-pipeline",
    "parquet",
    "financial-data",
    "etl",
    "data-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dlt[filesystem,parquet,duckdb]>=0.4.0",
    "ib-connector>=0.1.0",
    "matplotlib>=3.9.0",
    "notebook>=7.0.0",
    "pandas>=2.0.0",
    "pandas-market-calendars>=5.0.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.0.0",
    "rich>=14.0.0",
    "structlog>=25.0.0",
    "typer>=0.19.0",
]

[project.scripts]
dlt-ibapi = "dlt_ibapi.cli_app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
ib-connector = { path = "../ib-connector", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_ibapi"]

[tool.hatch.build.targets.wheel.shared-data]
"src/dlt_ibapi/config_files" = "dlt_ibapi/config_files"

[tool.ruff]
line-length = 100
target-version = "py312"
