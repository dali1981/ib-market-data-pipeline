# DLT Configuration for dlt-ibapi
# This configures DLT to store market data in Parquet files

[pipeline]
# Use Parquet format for all data loads
loader_file_format = "parquet"

[destination.filesystem]
# Local filesystem destination
# Market data will be stored in ./data directory
bucket_url = "data"

# Layout template for organizing Parquet files
# Use standard DLT placeholders: {table_name} and {load_id}
# Custom partitioning by date/symbol is handled by DLT resources via columns config
layout = "{table_name}/{load_id}.{file_id}.{ext}"

# No credentials section needed for local filesystem
# For cloud storage (S3/GCS/Azure), add credentials to .dlt/secrets.toml

[normalize]
# DLT normalization settings
json_module = "simplejson"

# Store DLT metadata in separate location
# This keeps pipeline state separate from market data
[destination.duckdb]
# Small DuckDB file for DLT metadata only
credentials = ".dlt-ibapi/pipeline_metadata.duckdb"
