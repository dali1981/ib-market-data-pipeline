
[project]
name = "dlt-ibapi"
version = "0.1.0"
description = "DLT connector for Interactive Brokers - ingest market data via IB Gateway/TWS into data pipelines"
requires-python = ">=3.12"
dependencies = [
    "delta-lake-storage",
    "dlt[filesystem,parquet,duckdb]>=0.4.0", # Added filesystem and parquet extras
    "ib-connector>=0.1.0",
    "matplotlib>=3.10.7", # For equity curve plots in backtesting
    "notebook>=7.4.7",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "pandas-market-calendars>=5.1.1",
    "pyarrow>=21.0.0",
    "pydantic>=2.0.0",
    "rich>=14.2.0",
    "scipy>=1.15.3",
    "structlog>=25.5.0",
    "tools>=0.1.0", # Shared backtesting framework
    "typer>=0.19.2",
]

[project.scripts]
dlt-ibapi = "dlt_ibapi.cli_app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
ib-connector = { path = "../ib-connector", editable = true }
tools = { path = "../tools", editable = true }
delta-lake-storage = { path = "../delta-lake-storage" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_ibapi"]

[tool.hatch.build.targets.wheel.shared-data]
"src/dlt_ibapi/config_files" = "dlt_ibapi/config_files"

[tool.ruff]
line-length = 100
target-version = "py312"
