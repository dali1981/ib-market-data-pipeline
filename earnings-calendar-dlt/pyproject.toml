[project]
name = "earnings-calendar-dlt"
version = "0.1.0"
description = "Modular earnings calendar scraper with dlt and Dagster integration"
requires-python = ">=3.10"
dependencies = [
    "dlt[filesystem,parquet,duckdb]>=0.4.0",
    "dagster>=1.9.0",
    "dagster-dlt>=0.27.0",
    "playwright>=1.48.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=21.0.0",
    "httpx>=0.27.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "dagster-webserver>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_calendar", "dagster_earnings"]

[tool.ruff]
line-length = 100
target-version = "py310"
